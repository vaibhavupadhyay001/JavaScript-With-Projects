<!DOCTYPE html>
<html>
<head>
  <title>XO Game Simple</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #eef2f3;
    }

    .board {
      width: 300px;
      height: 300px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .cell {
      background: white;
      border: 2px solid black;
      font-size: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      font-size: 20px;
      height: 25px;
    }

    button {
      margin-top: 10px;
      padding: 8px 15px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="board">
    <div class="cell" onclick="makeMove(this, 0)"></div>
    <div class="cell" onclick="makeMove(this, 1)"></div>
    <div class="cell" onclick="makeMove(this, 2)"></div>
    <div class="cell" onclick="makeMove(this, 3)"></div>
    <div class="cell" onclick="makeMove(this, 4)"></div>
    <div class="cell" onclick="makeMove(this, 5)"></div>
    <div class="cell" onclick="makeMove(this, 6)"></div>
    <div class="cell" onclick="makeMove(this, 7)"></div>
    <div class="cell" onclick="makeMove(this, 8)"></div>
  </div>

  <div id="status">Player Turn: X</div>
  <button onclick="resetGame()">Reset Game</button>

  <script src="xoxo.js">
   
  </script>

</body>
</html>
